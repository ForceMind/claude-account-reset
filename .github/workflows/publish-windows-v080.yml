name: Publish verified Windows v0.8.0
on:
  push:
    branches: [windows-support]
    paths: ['.github/workflows/publish-windows-v080.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ForceMind/claude-account-reset
      VERIFIED_RUN: '44547615817'
      VERIFIED_COMMIT: b93aa89661e7d2fcd2a95e5b83c1d4150f9bad55
    steps:
      - name: Confirm exact verified candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            run=$(gh run view "$VERIFIED_RUN" --json headSha,status,conclusion)
            test "$(jq -r .headSha <<< "$run")" = "$VERIFIED_COMMIT"
            if [[ "$(jq -r .status <<< "$run")" == completed ]]; then
              test "$(jq -r .conclusion <<< "$run")" = success
              exit 0
            fi
            sleep 15
          done
          exit 1
      - name: Download verified Windows files
        uses: actions/download-artifact@v4
        with:
          name: claude-account-reset-windows-x64
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Download verified source and Skill
        uses: actions/download-artifact@v4
        with:
          name: claude-account-reset-source
          run-id: ${{ env.VERIFIED_RUN }}
          github-token: ${{ github.token }}
          path: release
      - name: Verify and publish the exact assets
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          exe=Claude-Account-Reset-0.8.0-win-x64.exe
          zip=Claude-Account-Reset-0.8.0-win-x64.zip
          archive=claude-account-reset-0.8.0.tar.gz
          tr -d '\r' < SHA256SUMS > runner-checks.txt
          sha256sum --check --strict runner-checks.txt
          test "$(tar -xOf "$archive" package.json | jq -r .version)" = 0.8.0
          tar -tzf "$archive" > members.txt
          for file in bin/windows.mjs SKILL.md package-lock.json docs/WINDOWS.md docs/RESET-CHECKLIST.md; do
            grep -Fxq "$file" members.txt
          done
          if grep -Eq '\.(jsonl|sqlite|dmg|zip)$|\.(report|plan)\.json$|(^|/)(payload|operation-backups)/' members.txt; then
            exit 1
          fi
          sha256sum "$exe" "$zip" "$archive" > SHA256SUMS
          cat > notes.md <<'NOTES'
          Windows x64 预览版。

          - 桌面应用和 CLI 核对 Windows 数据根，预览选定的登录项和已识别的 Cookie。
          - Windows CLI 支持可读历史的脱敏归档，以及先校验、后隔离、可回滚的活动目录流程。
          - 安装器未签名。CLI 需 Node.js 22.13+。解压后运行 `npm ci --omit=dev --ignore-scripts --no-audit --no-fund`。

          验证使用合成资料。实际账号、首次启动身份和原生续接需另行确认。浏览器未验证。

          [Windows 使用说明](https://github.com/ForceMind/claude-account-reset/blob/v0.8.0/docs/WINDOWS.md) · [重置检查清单](https://github.com/ForceMind/claude-account-reset/blob/v0.8.0/docs/RESET-CHECKLIST.md) · [构建与测试](https://github.com/ForceMind/claude-account-reset/actions/runs/44547615817)
          NOTES
          gh release create v0.8.0 --target "$VERIFIED_COMMIT" --title 'v0.8.0 · Windows x64 预览版' --draft --prerelease --notes-file notes.md "$exe" "$zip" "$archive" SHA256SUMS
          gh api "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == "v0.8.0") | .assets[] | [.name,.digest] | @tsv' > uploaded.tsv
          sha256sum SHA256SUMS > SHA256SUMS.expected
          cat SHA256SUMS >> SHA256SUMS.expected
          while read -r hash filename; do
            grep -Fxq "$(printf '%s\tsha256:%s' "$filename" "$hash")" uploaded.tsv
          done < SHA256SUMS.expected
          gh release edit v0.8.0 --draft=false
          gh release view v0.8.0 --json url,tagName,targetCommitish,isDraft,isPrerelease
