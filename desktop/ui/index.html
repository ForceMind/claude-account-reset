<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Claude Account Reset</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside>
    <div class="brand"><span class="brand-mark">C<span>↗</span></span><div>Claude Account Reset<small>本地账号维护</small></div></div>
    <p class="eyebrow">工作区</p>
    <button class="nav active" id="nav-reset">◈　检查与清理</button>
    <button class="nav" id="nav-backups">▣　备份与恢复</button>
    <div class="side-note"><span class="status-dot"></span>资料始终留在本机<p>不上传会话、配置或备份。<br>执行前先审阅，再备份。</p></div>
    <div class="version" id="version">macOS 客户端</div>
  </aside>
  <main>
    <header><span id="breadcrumb">账号维护 / 检查与清理</span><span class="badge">LOCAL ONLY</span></header>
    <div id="demo" class="demo" hidden>演示模式 · 仅使用自动生成的合成资料，系统钥匙串不可用。</div>
    <div id="alert" class="alert" role="alert" hidden></div>
    <section id="progress" class="progress-panel" aria-live="polite" hidden><div><strong id="progress-title">正在处理</strong><p id="progress-message">请保持客户端打开。</p></div><button class="button secondary" id="cancel">安全停止</button></section>
    <section id="content"></section>
    <footer>独立开源项目 · 与 Anthropic 无隶属关系 · 本地检查不代表服务端状态或真实模型续聊验证</footer>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>
